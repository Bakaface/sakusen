# Sortie project configuration. Scaffolded by `sortie init` — edit freely.
max_workers: 3

git:
  branch_template: "sortie/{{task_id}}-{{task_slug}}"

on_complete: commit

# Agents: every workflow step runs one of these shell commands. Steps pick an
# agent via `agent: <slug>` (step level beats workflow level beats
# default_agent). The agent's mode decides how the step executes:
#   headless — sortie spawns the command, streams its stdout, and reads the
#              final result text from $SORTIE_RESULT_FILE
#   tmux     — sortie runs the command inside a detached tmux session; a
#              turn-end sentinel written to $SORTIE_DONE_DIR auto-advances the
#              workflow (see .sortie/agents/claude-settings.json)
# The scaffolded records shell out to user-owned scripts under
# .sortie/agents/ — swap the commands to use any other tool (opencode, aider,
# a raw model CLI, ...).
default_agent: claude

agents:
  claude:
    mode: headless
    command: '"$SORTIE_PROJECT_PATH/.sortie/agents/claude-headless.sh"'
  claude-tmux:
    mode: tmux
    command: '"$SORTIE_PROJECT_PATH/.sortie/agents/claude-tmux.sh"'
    resume_command: 'claude --dangerously-skip-permissions --resume "$SORTIE_SESSION_ID"'
    chat_log_command: '"$SORTIE_PROJECT_PATH/.sortie/agents/claude-chat-log.sh"'

# Summarizer: the utility LLM command used for chat/step summaries, the final
# task summary, and AI task titles. Prompt arrives on stdin; response goes to
# stdout. Remove this block to disable (titles fall back to truncated input,
# summaries are skipped).
summarizer:
  command: claude -p --output-format text --model haiku --dangerously-skip-permissions
  max_prompt_bytes: 380000

